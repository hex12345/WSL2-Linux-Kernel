name: wsl-kernel-build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linux-msft-wsl-6.6.y

      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc pahole cpio

      - name: make
        run: |
          make -j$(nproc) KCONFIG_CONFIG=arch/x86/configs/config-wsl
          cp arch/x86/boot/bzImage ./bzImage-custom

      - uses: actions/upload-artifact@v4
        with:
          name: bzImage-custom
          path: bzImage-custom

